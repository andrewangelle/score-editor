name: CI Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      browser:
        description: 'Playwright target to run'
        type: choice
        required: false
        default: chromium
        options:
          - chromium
          - all
          - firefox
          - webkit
          - mobile:chrome
          - mobile:safari
          - edge
          - chrome
      update_snapshots:
        description: 'Regenerate visual regression baselines'
        type: boolean
        required: false
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint check
        run: pnpm lint:check

      - name: Type check
        run: pnpm test:types

      - name: Unit Tests
        run: pnpm test

      # Defaults to chromium: `inputs` is empty on pull_request runs.
      - name: Resolve playwright target
        id: target
        run: |
          case "${{ inputs.browser || 'chromium' }}" in
            chromium)      script="test:e2e";               browsers="chromium" ;;
            all)           script="test:e2e:all";           browsers="chromium firefox webkit msedge chrome" ;;
            firefox)       script="test:e2e:firefox";       browsers="firefox" ;;
            webkit)        script="test:e2e:webkit";        browsers="webkit" ;;
            mobile:chrome) script="test:e2e:mobile:chrome"; browsers="chromium" ;;
            mobile:safari) script="test:e2e:mobile:safari"; browsers="webkit" ;;
            edge)          script="test:e2e:edge";          browsers="msedge" ;;
            chrome)        script="test:e2e:chrome";        browsers="chrome" ;;
            *)             echo "Unknown browser target: ${{ inputs.browser }}" >&2; exit 1 ;;
          esac
          echo "script=$script" >> "$GITHUB_OUTPUT"
          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps ${{ steps.target.outputs.browsers }}

      - name: E2E tests
        run: pnpm ${{ steps.target.outputs.script }}
        env:
          CI: true

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1

  visual-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Enable corepack
        run: |
          # corepack is pre-installed in the Playwright image but needs
          # activation; run as the container user (1001) since --user is set.
          corepack enable --install-directory ~/.corepack
          echo "$HOME/.corepack" >> "$GITHUB_PATH"
          corepack prepare pnpm@10.33.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run visual tests
        id: visual
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.update_snapshots }}" = "true" ]; then
            EXTRA_FLAGS="--update-snapshots"
          fi
          pnpm exec playwright test --project=visual $EXTRA_FLAGS
        env:
          CI: true

      - name: Commit updated baselines
        if: inputs.update_snapshots == 'true' && steps.visual.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__/
          git diff --cached --quiet && echo "No baseline changes" && exit 0
          git commit -m "chore: update visual regression baselines"
          git push

      - name: Upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-visual
          path: playwright-report/
          retention-days: 7